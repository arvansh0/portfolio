        .skills-hero {
            height: 40vh;

        .skills-hero::before {

            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;

        .skill-category::before {

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(44, 62, 80, 0.6);
            z-index: 1;

        .skill-category:hover {

    <script>
        // Mobile menu functionality for skills page
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.menu-toggle');
            const navMobile = document.querySelector('.nav-mobile');
            const body = document.body;

            if (menuToggle && navMobile) {
                // Toggle menu
                menuToggle.addEventListener('click', () => {
                    menuToggle.classList.toggle('active');
                    navMobile.classList.toggle('active');
                    body.classList.toggle('menu-open');
                });

                // Close menu when clicking outside
                document.addEventListener('click', (e) => {
                    if (!menuToggle.contains(e.target) && 
                        !navMobile.contains(e.target) && 
                        navMobile.classList.contains('active')) {
                        menuToggle.classList.remove('active');
                        navMobile.classList.remove('active');
                        body.classList.remove('menu-open');
                    }
                });

                // Close menu when clicking on links
                const mobileLinks = navMobile.querySelectorAll('a');
                mobileLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        menuToggle.classList.remove('active');
                        navMobile.classList.remove('active');
                        body.classList.remove('menu-open');
                    });
                });

                // Handle window resize
                window.addEventListener('resize', () => {
                    if (window.innerWidth > 768 && navMobile.classList.contains('active')) {
                        menuToggle.classList.remove('active');
                        navMobile.classList.remove('active');
                        body.classList.remove('menu-open');
                    }
                });
            }

            // Set current year
            const yearElement = document.getElementById('year');
            if (yearElement) {
                yearElement.textContent = new Date().getFullYear();
            }
        });
    </script>

        <!-- Auto-refresh and cache-busting script -->
        <script>
            // Cache-busting function
            function addCacheBuster() {
                const timestamp = new Date().getTime();
                const links = document.querySelectorAll('link[rel="stylesheet"]');
                const scripts = document.querySelectorAll('script[src]');
                const images = document.querySelectorAll('img[src]');
                
                // Add cache buster to CSS
                links.forEach(link => {
                    if (link.href && !link.href.includes('fonts.googleapis.com') && !link.href.includes('cdnjs.cloudflare.com')) {
                        link.href = link.href + '?v=' + timestamp;
                    }
                });
                
                // Add cache buster to JS
                scripts.forEach(script => {
                    if (script.src && !script.src.includes('cdnjs.cloudflare.com')) {
                        script.src = script.src + '?v=' + timestamp;
                    }
                });
                
                // Add cache buster to images
                images.forEach(img => {
                    if (img.src && !img.src.includes('data:')) {
                        img.src = img.src + '?v=' + timestamp;
                    }
                });
            }
            
            // Auto-refresh mechanism
            function checkForUpdates() {
                // Check if the page has been updated by comparing with a server timestamp
                fetch(window.location.href + '?check=' + new Date().getTime(), {
                    method: 'HEAD',
                    cache: 'no-cache'
                }).then(response => {
                    const lastModified = response.headers.get('last-modified');
                    if (lastModified && window.lastModifiedTime && lastModified !== window.lastModifiedTime) {
                        // Page has been updated, refresh
                        window.location.reload(true);
                    }
                    window.lastModifiedTime = lastModified;
                }).catch(() => {
                    // If fetch fails, just continue
                });
            }
            
            // Force refresh on page load
            function forceRefresh() {
                // Add timestamp to prevent caching
                if (window.location.search.indexOf('v=') === -1) {
                    const url = new URL(window.location);
                    url.searchParams.set('v', new Date().getTime());
                    window.history.replaceState({}, '', url);
                }
            }
            
            // Initialize on page load
            document.addEventListener('DOMContentLoaded', function() {
                forceRefresh();
                addCacheBuster();
                
                // Check for updates every 30 seconds
                setInterval(checkForUpdates, 60000);
                
                // Force refresh every 5 minutes to ensure fresh content
                setTimeout(() => {
                    window.location.reload(true);
                }, 600000); // 5 minutes
            });
            
            // Override browser back/forward cache
            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    window.location.reload(true);
                }
            });
            
            // Prevent caching of this page
            window.addEventListener('beforeunload', function() {
                // Clear any cached data
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        names.forEach(function(name) {
                            caches.delete(name);
                        });
                    });
                }
            });
        </script>
